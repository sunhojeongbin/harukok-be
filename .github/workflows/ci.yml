name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # 잡 이름 `ci` 는 main 보호의 필수 상태 검사 이름이다. 바꾸지 않는다.
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # CI 전용 더미 값
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/harukok_dev
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/harukok_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integrity -- --base origin/${{ github.base_ref || 'main' }}
      - run: npm run db:setup
      - run: npm run db:check
      - run: npm run test:e2e
